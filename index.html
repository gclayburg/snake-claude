<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Games</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, #1a472a 0%, #0d2818 45%, #1c3d2e 100%);
            font-family: Arial, sans-serif;
            color: #f5f5f5;
            padding: 24px 16px 40px;
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 5vw, 2.75rem);
            letter-spacing: 0.02em;
        }

        header p {
            margin: 0;
            color: rgba(255, 255, 255, 0.75);
            font-size: 1.05rem;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .game-card:hover,
        .game-card:focus-visible {
            transform: translateY(-4px);
            border-color: rgba(126, 217, 87, 0.6);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
            outline: none;
        }

        .game-card img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            display: block;
            background: #111;
        }

        .game-card-body {
            padding: 18px 20px 22px;
        }

        .game-card h2 {
            margin: 0 0 8px;
            font-size: 1.35rem;
        }

        .game-card p {
            margin: 0;
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .play-label {
            display: inline-block;
            margin-top: 14px;
            color: #7ed957;
            font-weight: bold;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>Snake Games</h1>
            <p>Pick a version to play</p>
        </header>

        <div class="games">
            <a class="game-card" href="snake.html">
                <img src="images/snake-preview.png" alt="Classic Snake game preview showing the start screen and game board">
                <div class="game-card-body">
                    <h2>Classic Snake</h2>
                    <p>Turn-based controls, high score leaderboard, and mobile touch support with left/right taps.</p>
                    <span class="play-label">Play Classic Snake →</span>
                </div>
            </a>

            <a class="game-card" href="snake2.html">
                <img src="images/snake2-preview.png" alt="Fullscreen Snake game preview showing the start screen on a large canvas">
                <div class="game-card-body">
                    <h2>Fullscreen Snake</h2>
                    <p>Responsive fullscreen canvas that scales to your screen for a simple arcade experience.</p>
                    <span class="play-label">Play Fullscreen Snake →</span>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
